name: Continuous Integration

on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  ci:
    name: Run Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpunit, xdebug
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Run PHPUnit Tests
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-clover=coverage/clover.xml --path-coverage

      - uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/clover.xml

  build:
        name: Package Plugin
        runs-on: ubuntu-latest
        needs: ci
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up PHP
            uses: shivammathur/setup-php@v2
            with:
              php-version: '8.2'

          - name: Install Dependencies
            run: composer install --no-dev --no-progress --prefer-dist

          - name: Generate Plugin Header
            run: composer generate-header

          - name: Make build script executable
            run: chmod +x build/version.sh build/build.sh

          - name: Generate version.php
            run: bash ./build/version.sh

          - name: Run build script
            run: ./build/build.sh

          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with:
              name: wp-xpub-build
              path: build/xpub
          - name: Upload Plugin ZIP to GitHub Release (only on tag)
            if: startsWith(github.ref, 'refs/tags/')
            uses: softprops/action-gh-release@v1
            with:
              tag_name: ${{ github.ref_name }}
              files: build/wp-xpub.zip
